import UIKit
import simd

final class AppDelegate: UIResponder, UIApplicationDelegate {
    var window: UIWindow?; var overlayWin: UIWindow?; var overlay: OverlayView!; var menu: MenuView!
    var mem = FFMemory(); var aim = FFAim(); var timer: DispatchSourceTimer?; var cfg = Config.shared

    func application(_ app: UIApplication, didFinishLaunchingWithOptions o: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
        cfg.load()
        window = UIWindow(frame: UIScreen.main.bounds)
        let vc = UIViewController(); vc.view.backgroundColor = .black; window?.rootViewController = vc; window?.makeKeyAndVisible()

        overlayWin = UIWindow(frame: UIScreen.main.bounds)
        overlayWin?.windowLevel = UIWindow.Level(rawValue: UIWindow.Level.statusBar.rawValue + 10_000_000)
        overlayWin?.backgroundColor = .clear; overlayWin?.isUserInteractionEnabled = true
        let ovc = UIViewController(); ovc.view.backgroundColor = .clear
        overlay = OverlayView(frame: ovc.view.bounds); overlay.autoresizingMask = [.flexibleWidth, .flexibleHeight]; ovc.view.addSubview(overlay)
        menu = MenuView(frame: CGRect(x: cfg.menuX, y: cfg.menuY, width: 260, height: 44)); ovc.view.addSubview(menu)
        menu.onAttach = { [weak self] in self?.attach() }; menu.onDetach = { [weak self] in self?.detach() }; menu.onApply = { [weak self] in self?.overlay.setNeedsDisplay() }
        overlayWin?.rootViewController = ovc; overlayWin?.makeKeyAndVisible()
        _ = aim.load()

        let docPath = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("offsets.json").path
        if FileManager.default.fileExists(atPath: docPath) { mem.loadOffsets(docPath) }
        else if let p = Bundle.main.path(forResource: "offsets", ofType: "json") { mem.loadOffsets(p) }

        DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { [weak self] in self?.attach() }
        return true
    }

    func attach() {
        if mem.attach(["FreeFire", "freefire", "FreeFireMax", "Free Fire"]) { overlay.connected = true; start() }
        else { overlay.connected = false; DispatchQueue.main.asyncAfter(deadline: .now() + 2) { [weak self] in self?.attach() } }
    }

    func detach() { timer?.cancel(); timer = nil; overlay.connected = false }
    func start() {
        timer?.cancel(); timer = DispatchSource.makeTimerSource(queue: .main); timer?.schedule(deadline: .now(), repeating: .milliseconds(8))
        timer?.setEventHandler { [weak self] in self?.tick() }; timer?.resume()
    }

    func tick() {
        guard mem.attached else { return }
        let lp = mem.base + mem.off.localPlayer; let localPos = mem.readVec3(lp + mem.off.position) ?? Vec3(); let localTeam = mem.readU32(lp + mem.off.team) ?? 0
        guard let vm = mem.readMat4(mem.base + mem.off.viewMatrix) else { return }
        let screen = UIScreen.main.bounds.size; let count = Int(mem.readU32(mem.base + mem.off.entityCount) ?? 0)
        guard count > 0 && count <= 200 else { return }
        overlay.boxes.removeAll(); overlay.lines.removeAll(); overlay.labels.removeAll(); overlay.crosshair = nil
        let listBase = mem.base + mem.off.entityList; var best: CGPoint?; var bestDist: CGFloat = CGFloat(cfg.aimFov)
        for i in 0..<count {
            let e = listBase + UInt(i) * mem.off.entityStride; let team = mem.readU32(e + mem.off.team) ?? 0; guard team != localTeam else { continue }
            let hp = mem.readF32(e + mem.off.health) ?? 0; guard hp > 0 else { continue }
            guard let pos = mem.readVec3(e + mem.off.position), let head = mem.readVec3(e + mem.off.headBone),
                  let s = worldToScreen(vm: vm, p: pos, w: Float(screen.width), h: Float(screen.height)),
                  let h = worldToScreen(vm: vm, p: head, w: Float(screen.width), h: Float(screen.height)) else { continue }
            let boxH = s.y - h.y; guard boxH > 0 && boxH < 800 else { continue }
            let boxW = boxH / 2; let r = CGRect(x: h.x - boxW / 2, y: h.y, width: boxW, height: boxH); let color: UIColor = cfg.espTeamColor ? teamColor(team) : .red
            if cfg.espBox { overlay.boxes.append(.init(rect: r, color: color)) }
            if cfg.espLine { overlay.lines.append((h, color)) }
            if cfg.espDistance { let dx = pos.x - localPos.x, dz = pos.z - localPos.z; let d = sqrtf(dx * dx + dz * dz); overlay.labels.append(.init(text: String(format: "%.0fm", d), point: CGPoint(x: h.x - boxW / 2, y: h.y - 14), color: .yellow)) }
            if cfg.espHealth { overlay.labels.append(.init(text: String(format: "%.0f", hp), point: CGPoint(x: h.x - boxW / 2 - 24, y: h.y + 2), color: .green)) }
            let cd = hypot(h.x - screen.width / 2, h.y - screen.height / 2)
            if cd < bestDist { bestDist = cd; best = h }
        }
        if cfg.aimEnabled, let t = best { overlay.crosshair = t; overlay.crosshairRadius = CGFloat(cfg.aimFov); aim.touch(x: Double(t.x), y: Double(t.y)) }
        if cfg.godMode { _ = mem.writeF32(lp + mem.off.health, cfg.godValue) }
        if cfg.ammoLock { _ = mem.writeU32(lp + mem.off.ammo, cfg.ammoValue) }
        overlay.setNeedsDisplay()
    }
    private func teamColor(_ t: UInt32) -> UIColor { let palette: [UIColor] = [.systemRed, .systemBlue, .systemGreen, .systemOrange, .systemPurple, .systemPink]; return palette[Int(t) % palette.count] }
}
