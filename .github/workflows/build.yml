        let sw = UISwitch(); sw.isOn = cfg[keyPath: key]; sw.transform = CGAffineTransform(scaleX: 0.72, y: 0.72); sw.frame = CGRect(x: 178, y: 0, width: 60, height: 30); sw.tag = String(describing: key).hashValue; sw.addTarget(self, action: #selector(onToggle(_:)), for: .valueChanged); row.addSubview(sw)
