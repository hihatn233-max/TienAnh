        buildBody(); layoutBody(); restorePosition()
        header.addGestureRecognizer(UIPanGestureRecognizer(target: self, action: #selector(onPan(_:))))
    }
    private func restorePosition() { frame.origin = CGPoint(x: cfg.menuX, y: cfg.menuY); frame.size = CGSize(width: 260, height: 44 + (collapsed ? 0 : bodyHeight() + 12)) }
