    private func layoutBody() { var y: CGFloat = 0; body.layoutIfNeeded(); for v in body.arrangedSubviews { v.frame.origin.y = y; y += v.frame.height + body.spacing }; body.frame.size.height = y }
    private func makeSection(_ title: String) -> UILabel { let l = UILabel(); l.text = title; l.textColor = UIColor(red: 1, green: 0.55, blue: 0.55, alpha: 1); l.font = .boldSystemFont(ofSize: 11); l.heightAnchor.constraint(equalToConstant: 16).isActive = true; return l }
