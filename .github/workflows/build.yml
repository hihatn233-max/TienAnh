import Foundation
import Darwin
import MachO

struct FFOffsets { var localPlayer: UInt = 0; var entityList: UInt = 0; var entityStride: UInt = 0; var entityCount: UInt = 0; var viewMatrix: UInt = 0; var health: UInt = 0; var team: UInt = 0; var position: UInt = 0; var headBone: UInt = 0; var ammo: UInt = 0 }
final class FFMemory {
    private(set) var task: mach_port_t = 0; private(set) var base: UInt = 0; private(set) var pid: pid_t = 0
    var off = FFOffsets(); var attached: Bool { task != 0 && base != 0 }
    func attach(_ names: [String]) -> Bool {
        let count = proc_listpids(UInt32(PROC_ALL_PIDS), 0, nil, 0); guard count > 0 else { return false }
        var pids = [pid_t](repeating: 0, count: Int(count))
        let n = proc_listpids(UInt32(PROC_ALL_PIDS), 0, &pids, Int32(pids.count * MemoryLayout<pid_t>.size)); guard n > 0 else { return false }
        for p in pids where p > 0 {
            var path = [CChar](repeating: 0, count: Int(PROC_PIDPATHINFO_MAXSIZE))
            guard proc_pidpath(p, &path, UInt32(path.count)) > 0 else { continue }
            guard names.contains(URL(fileURLWithPath: String(cString: path)).lastPathComponent) else { continue }
            pid = p; var t: mach_port_t = 0; guard task_for_pid(mach_task_self_, p, &t) == KERN_SUCCESS else { continue }
            task = t; base = findMainBinaryBase(); if base != 0 { return true }
        }
        return false
    }
    private func findMainBinaryBase() -> UInt {
        var addr: mach_vm_address_t = 0; var best: UInt = 0; var bestSize: mach_vm_size_t = 0
        while true {
            var size: mach_vm_size_t = 0; var depth: natural_t = 0; var info = vm_region_submap_info_64(); var cnt = mach_msg_type_number_t(MemoryLayout<vm_region_submap_info_64>.size / MemoryLayout<integer_t>.size)
            let kr = withUnsafeMutablePointer(to: &info) { $0.withMemoryRebound(to: integer_t.self, capacity: Int(cnt)) { mach_vm_region_recurse(task, &addr, &size, &depth, $0, &cnt) } }
            if kr != KERN_SUCCESS { break }
            if size > bestSize && size > 1_048_576 { var magic: UInt32 = 0; if read(addr, into: &magic, size: 4) && (magic == MH_MAGIC_64 || magic == MH_CIGAM_64) { best = UInt(addr); bestSize = size } }
            addr += size
        }
        return best
    }
    @discardableResult func read<T>(_ addr: UInt, into out: inout T, size: Int? = nil) -> Bool {
        guard attached, addr != 0 else { return false }; let sz = size ?? MemoryLayout<T>.size; var outsz: mach_vm_size_t = 0
        let kr = withUnsafeMutablePointer(to: &out) { mach_vm_read_overwrite(task, addr, mach_vm_size_t(sz), mach_vm_address_t(UInt(bitPattern: $0)), &outsz) }
        return kr == KERN_SUCCESS && outsz == mach_vm_size_t(sz)
    }
    func readVec3(_ a: UInt) -> Vec3? { var v = Vec3(); return read(a, into: &v, size: 12) ? v : nil }
    func readMat4(_ a: UInt) -> simd_float4x4? { var m = simd_float4x4(0); return read(a, into: &m, size: 64) ? m : nil }
    func readF32(_ a: UInt) -> Float? { var v: Float = 0; return read(a, into: &v) ? v : nil }
    func readU32(_ a: UInt) -> UInt32? { var v: UInt32 = 0; return read(a, into: &v) ? v : nil }
    @discardableResult func write<T>(_ addr: UInt, value: T) -> Bool {
        guard attached, addr != 0 else { return false }; var prot: vm_prot_t = 0; var cur = vm_region_submap_info_64(); var cnt = mach_msg_type_number_t(MemoryLayout<vm_region_submap_info_64>.size / MemoryLayout<integer_t>.size); var a = mach_vm_address_t(addr); var sz: mach_vm_size_t = 0; var depth: natural_t = 0
        _ = withUnsafeMutablePointer(to: &cur) { $0.withMemoryRebound(to: integer_t.self, capacity: Int(cnt)) { mach_vm_region_recurse(task, &a, &sz, &depth, $0, &cnt) } }
        prot = cur.protection
        if (prot & VM_PROT_WRITE) == 0 { mach_vm_protect(task, mach_vm_address_t(addr), mach_vm_size_t(MemoryLayout<T>.size), boolean_t(0), VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY) }
        var v = value; let kr = withUnsafeMutablePointer(to: &v) { mach_vm_write(task, mach_vm_address_t(addr), vm_offset_t(UInt(bitPattern: $0)), mach_msg_type_number_t(MemoryLayout<T>.size)) }
        if (prot & VM_PROT_WRITE) == 0 { mach_vm_protect(task, mach_vm_address_t(addr), mach_vm_size_t(MemoryLayout<T>.size), boolean_t(0), prot) }
        return kr == KERN_SUCCESS
    }
    func loadOffsets(_ path: String) {
        guard let d = try? Data(contentsOf: URL(fileURLWithPath: path)), let j = try? JSONSerialization.jsonObject(with: d) as? [String: String] else { return }
        func h(_ k: String) -> UInt { UInt(j[k] ?? "0x0", radix: 16) ?? 0 }
        off.localPlayer = h("local_player"); off.entityList = h("entity_list"); off.entityStride = h("entity_stride"); off.entityCount = h("entity_count"); off.viewMatrix = h("view_matrix"); off.health = h("health"); off.team = h("team"); off.position = h("position"); off.headBone = h("head_bone"); off.ammo = h("ammo")
    }
}
