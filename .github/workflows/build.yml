import UIKit
import simd

struct Vec3 { var x: Float = 0, y: Float = 0, z: Float = 0 }
func worldToScreen(vm: simd_float4x4, p: Vec3, w: Float, h: Float) -> CGPoint? {
    let cx = p.x * vm.columns.0.x + p.y * vm.columns.1.x + p.z * vm.columns.2.x + vm.columns.3.x
    let cy = p.x * vm.columns.0.y + p.y * vm.columns.1.y + p.z * vm.columns.2.y + vm.columns.3.y
    let cw = p.x * vm.columns.0.w + p.y * vm.columns.1.w + p.z * vm.columns.2.w + vm.columns.3.w
    if cw <= 0.001 { return nil }
    return CGPoint(x: CGFloat((cx / cw * 0.5 + 0.5) * w), y: CGFloat((1.0 - (cy / cw * 0.5 + 0.5)) * h))
}
