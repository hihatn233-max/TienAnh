    }
    @objc private func onToggle(_ s: UISwitch) {
        let map: [Int: ReferenceWritableKeyPath<Config, Bool>] = [ String(describing: \Config.espBox).hashValue: \.espBox, String(describing: \Config.espLine).hashValue: \.espLine, String(describing: \Config.espDistance).hashValue: \.espDistance, String(describing: \Config.espHealth).hashValue: \.espHealth, String(describing: \Config.aimEnabled).hashValue: \.aimEnabled, String(describing: \Config.godMode).hashValue: \.godMode, String(describing: \Config.ammoLock).hashValue: \.ammoLock ]
        if let k = map[s.tag] { cfg[k] = s.isOn; cfg.save() }
    }
    private func makeButton(_ title: String, _ sel: Selector, _ color: UIColor) -> UIButton {
        let b = UIButton(type: .system); b.setTitle(title, for: .normal); b.setTitleColor(.white, for: .normal); b.titleLabel?.font = .boldSystemFont(ofSize: 12); b.backgroundColor = color; b.layer.cornerRadius = 8; b.heightAnchor.constraint(equalToConstant: 32).isActive = true; b.addTarget(self, action: sel, for: .touchUpInside); return b
    }
    private func buildBody() {
        body.addArrangedSubview(makeSection("ESP")); body.addArrangedSubview(makeToggle("Box", \.espBox)); body.addArrangedSubview(makeToggle("Line", \.espLine)); body.addArrangedSubview(makeToggle("Distance", \.espDistance)); body.addArrangedSubview(makeToggle("Health", \.espHealth))
        body.addArrangedSubview(makeSection("AIM")); body.addArrangedSubview(makeToggle("Enabled", \.aimEnabled))
        body.addArrangedSubview(makeSection("MEMORY")); body.addArrangedSubview(makeToggle("God Mode", \.godMode)); body.addArrangedSubview(makeToggle("Ammo Lock", \.ammoLock))
        body.addArrangedSubview(makeSection("SESSION")); body.addArrangedSubview(makeButton("ATTACH", #selector(doAttach), UIColor(red: 0.15, green: 0.55, blue: 0.25, alpha: 1))); body.addArrangedSubview(makeButton("DETACH", #selector(doDetach), UIColor(red: 0.55, green: 0.15, blue: 0.15, alpha: 1))); body.addArrangedSubview(makeButton("SAVE", #selector(doApply), UIColor(red: 0.15, green: 0.25, blue: 0.55, alpha: 1)))
    }
    @objc private func doAttach() { onAttach?() }; @objc private func doDetach() { onDetach?() }; @objc private func doApply() { cfg.save(); onApply?() }
