        let d: [String: Any] = ["espBox": espBox, "espLine": espLine, "espName": espName, "espDistance": espDistance, "espHealth": espHealth, "espTeamColor": espTeamColor, "aimEnabled": aimEnabled, "aimFov": aimFov, "aimSmooth": aimSmooth, "aimHoldRMB": aimHoldRMB, "aimHeadBone": aimHeadBone, "godMode": godMode, "godValue": godValue, "ammoLock": ammoLock, "ammoValue": ammoValue, "menuX": Double(menuX), "menuY": Double(menuY)]
