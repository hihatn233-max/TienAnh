import UIKit
final class OverlayView: UIView {
    struct Box { let rect: CGRect; let color: UIColor }
    struct Label { let text: String; let point: CGPoint; let color: UIColor }
    var boxes: [Box] = []; var lines: [(CGPoint, UIColor)] = []; var labels: [Label] = []
    var crosshair: CGPoint?; var crosshairRadius: CGFloat = 0; var connected: Bool = false
    override init(frame: CGRect) { super.init(frame: frame); backgroundColor = .clear; isOpaque = false; isUserInteractionEnabled = false; clearsContextBeforeDrawing = true }
    required init?(coder: NSCoder) { fatalError() }
    override func draw(_ rect: CGRect) {
        guard let ctx = UIGraphicsGetCurrentContext() else { return }
        ctx.setLineWidth(1.8)
        for b in boxes { ctx.setStrokeColor(b.color.cgColor); ctx.stroke(b.rect) }
        for (p, c) in lines { ctx.setStrokeColor(c.cgColor); ctx.move(to: CGPoint(x: bounds.midX, y: 0)); ctx.addLine(to: p); ctx.strokePath() }
        let font = UIFont.boldSystemFont(ofSize: 11)
        for l in labels { (l.text as NSString).draw(at: l.point, withAttributes: [.font: font, .foregroundColor: l.color]) }
        if let t = crosshair {
            ctx.setStrokeColor(UIColor.green.cgColor); ctx.setLineWidth(1.5)
            if crosshairRadius > 0 { ctx.strokeEllipse(in: CGRect(x: t.x - crosshairRadius, y: t.y - crosshairRadius, width: crosshairRadius * 2, height: crosshairRadius * 2)) }
            ctx.move(to: CGPoint(x: t.x - 8, y: t.y)); ctx.addLine(to: CGPoint(x: t.x + 8, y: t.y))
            ctx.move(to: CGPoint(x: t.x, y: t.y - 8)); ctx.addLine(to: CGPoint(x: t.x, y: t.y + 8)); ctx.strokePath()
        }
    }
}
